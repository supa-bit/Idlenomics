<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Idlenomics — Environment studies</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10191e; color: #eee9dc; font: 14px/1.5 system-ui,sans-serif; }
    header, main, footer { width: min(1680px, calc(100% - 48px)); margin: auto; }
    header { padding: 30px 0 22px; display:flex; align-items:end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
    h1 { font: 400 clamp(22px,3vw,36px)/1.2 Georgia,serif; margin: 5px 0 0; }
    .eyebrow { color:#b8baaa; font-size:11px; text-transform:uppercase; letter-spacing:.18em; }
    .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .group { display:flex; gap:3px; padding:4px; background:#1d2a30; border:1px solid #3b494b; border-radius:7px; }
    button,select { border:0; color:#d3d7cb; background:transparent; font:inherit; padding:7px 10px; border-radius:4px; cursor:pointer; }
    select { color:#eee9dc; }
    select option { background:#1d2a30; }
    button[aria-pressed="true"] { color:#fff4d3; background:#465953; }
    button:hover { background:#34463f; }
    :focus-visible { outline:2px solid #ddc18d; outline-offset:2px; }
    figure { margin:0; border:1px solid #58625b; background:#182127; box-shadow:0 18px 60px #0004; }
    #study-output { display:block; width:100%; height:auto; }
    figcaption { padding:14px 18px; color:#b9c2ba; font-size:12px; border-top:1px solid #384940; }
    footer { padding:22px 0; display:flex; justify-content:space-between; gap:24px; color:#9dacaa; font-size:12px; }
    footer p { margin:0; max-width:640px; }
    a { color:#dbc59a; }
    #world-bg-canvas { display:none; }
    @media(max-width:600px) { header,main,footer { width:calc(100% - 24px); } header { padding-top:20px; } footer{display:block} footer p+p{margin-top:12px} button,select{padding:7px} }
  </style>
</head>
<body>
  <header>
    <div><span class="eyebrow" id="eyebrow">Idlenomics · Environment study 02</span><h1 id="study-title">Vegetation & woodland</h1></div>
    <div class="controls" aria-label="Preview controls">
      <div class="group"><select id="era" aria-label="Era"><option value="stone">Stone Age</option><option value="bronze" selected>Bronze Age</option><option value="iron">Iron Age</option><option value="classical">Classical Age</option><option value="medieval">Medieval Age</option></select></div>
      <div class="group" aria-label="Lighting"><button id="night" aria-pressed="false">Dusk</button><button id="day" aria-pressed="true">Daylight</button></div>
      <div class="group" aria-label="View"><button id="mountains" aria-pressed="false">Mountains</button><button id="vegetation" aria-pressed="true">Vegetation</button><button id="scene" aria-pressed="false">Full scene</button></div>
      <div class="group"><button id="motion" aria-pressed="false">Play motion</button></div>
    </div>
  </header>
  <main><figure><canvas id="study-output" role="img" aria-label="Isolated vegetation preview"></canvas><figcaption id="caption">Branch structure · leaf texture · species variations · wind</figcaption></figure></main>
  <footer><p>Inspect each component separately, then switch to the full scene to judge forest clusters, clearings, scale, and contrast around the settlement.</p><p>Space: pause or play · <a href="./">Return to the game</a></p></footer>
  <canvas id="world-bg-canvas" aria-hidden="true"></canvas>
  <script type="module">
    import { WorldBackdropRenderer } from './world-canvas.js';
    const source = document.getElementById('world-bg-canvas');
    const output = document.getElementById('study-output');
    const ctx = output.getContext('2d', { alpha: false });
    const renderer = new WorldBackdropRenderer(source.id);
    renderer.pause();
    const params = new URLSearchParams(location.search);
    let era = ['stone','bronze','iron','classical','medieval'].includes(params.get('era')) ? params.get('era') : 'bronze';
    let paper = params.get('mode') !== 'dusk';
    let view = ['mountains','vegetation','scene'].includes(params.get('view')) ? params.get('view') : 'vegetation';
    let playing = false, time = 12, last = null, raf = 0;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const controls = Object.fromEntries(['era','day','night','mountains','vegetation','scene','motion','caption','study-title','eyebrow'].map(id => [id,document.getElementById(id)]));
    function synchronize() {
      controls.era.value = era;
      for(const [id,active] of [['day',paper],['night',!paper],['mountains',view==='mountains'],['vegetation',view==='vegetation'],['scene',view==='scene'],['motion',playing]]) controls[id].setAttribute('aria-pressed',String(active));
      controls.motion.textContent = playing ? 'Pause motion' : 'Play motion';
      controls['study-title'].textContent = view==='vegetation' ? 'Vegetation & woodland' : view==='mountains' ? 'Mountains & atmosphere' : 'The living valley';
      controls.eyebrow.textContent = `Idlenomics · ${view==='vegetation'?'Environment study 02':view==='mountains'?'Environment study 01':'Integration view'}`;
      output.setAttribute('aria-label',`${era} age ${paper?'daylight':'dusk'} ${view==='scene'?'settlement scene':view==='vegetation'?'vegetation study':'mountain and atmosphere study'}`);
      const query = new URLSearchParams({era,mode:paper?'day':'dusk',view});
      history.replaceState(null,'',`?${query}`);
    }
    function update() {
      renderer.updateState({ era,paperMode:paper,pop:29,
        buildings:{hide_tent:8,forager_hut:5,lumber_pile:1,mud_brick_hut:2,granary:1},
        jobs:{farmer:7,woodcutter:1,quarrier:1,hunter:1,scholar:2,artisan:1,miner:1},
        techs:['oral_tradition','caravan_trade'],wonders:{megalith:2} });
      synchronize(); paint();
    }
    function paint() {
      const waiting=view!=='vegetation'&&!renderer.mountains.ready;
      output.setAttribute('aria-busy',String(waiting));
      controls.caption.textContent = waiting ? 'Preparing this landscape…'
        : view==='vegetation' ? 'Branch structure · leaf texture · species variations · wind'
        : view==='scene' ? 'Integration view · woodland groves, cultivated clearings, riverbanks and foreground foliage'
        : 'Composed ridgelines · branching gullies · directional rock lighting · distant haze';
      renderer.time = time;
      renderer.reducedMotion = reduced.matches && !playing;
      if(view==='scene')renderer.draw();
      else if(view==='vegetation')paintVegetation(renderer.reducedMotion?0:time);
      else {
        const c=renderer.ctx;
        c.setTransform(renderer.dpr,0,0,renderer.dpr,0,0);
        for(let i=0;i<4;i++) {
          const layer=renderer.layers[i];
          c.drawImage(layer.canvas,-layer.pad,-layer.pad,renderer.width+layer.pad*2,renderer.height+layer.pad*2);
          if(i===1) renderer._plane(1,cc=>renderer._skyMotion(cc,renderer.reducedMotion?0:time));
        }
        renderer._plane(3,cc=>renderer.mountains.paintMist(cc,renderer.reducedMotion?0:time));
      }
      const worldCrop=view==='scene'?renderer.worldHeight:view==='vegetation'?galleryHeight:565;
      const height=Math.min(source.height,Math.round(source.height*worldCrop/renderer.worldHeight));
      if(output.width!==source.width)output.width=source.width;
      if(output.height!==height)output.height=height;
      ctx.drawImage(source,0,0,source.width,height,0,0,output.width,output.height);
    }
    let galleryHeight=720;
    function paintVegetation(t) {
      const c=renderer.ctx,v=renderer.vegetation,half=renderer.half;
      c.setTransform(renderer.dpr*renderer.scale,0,0,renderer.dpr*renderer.scale,renderer.dpr*renderer.width/2,0);
      c.globalAlpha=1;
      const narrow=renderer.width<650,columns=narrow?2:3,cell=half*2/columns;
      const size=Math.min(310,cell*.87),rowHeight=size+65,root=80+size;
      const species=[...new Set(v.species)];
      const rows=Math.ceil(species.length/columns),underY=root+(rows-1)*rowHeight+170;
      galleryHeight=Math.min(renderer.worldHeight,underY+70);
      const sky=c.createLinearGradient(0,0,0,galleryHeight);
      sky.addColorStop(0,paper?'#cdd4bf':'#344a50');sky.addColorStop(1,paper?'#9eae8b':'#20383b');
      c.fillStyle=sky;c.fillRect(-half,0,half*2,renderer.worldHeight);
      c.textAlign='center';c.font='15px system-ui,sans-serif';c.fillStyle=paper?'#405846':'#c2ccc1';
      species.forEach((kind,i)=>{
        const x=-half+cell*(i%columns+.5),y=root+Math.floor(i/columns)*rowHeight;
        c.save();c.globalAlpha=.16;c.fillStyle=v.tones.shadow;c.beginPath();c.ellipse(x,y+2,size*.35,size*.045,0,0,Math.PI*2);c.fill();c.restore();
        v.drawPlant(c,{x:x+size*.2,y:y-3,h:size*.61,kind,seed:47+i*101},t,true);
        v.drawPlant(c,{x:x-size*.08,y,h:size,kind,seed:17+i*157},t,true);
        c.fillStyle=paper?'#405846':'#c2ccc1';c.fillText(kind[0].toUpperCase()+kind.slice(1),x,y+31);
      });
      const under=['fern','shrub','reed'];
      under.forEach((kind,i)=>{
        const x=-half+half*2*(i+.5)/3;
        v.drawPlant(c,{x,y:underY,h:Math.min(102,half*.32),kind,seed:71+i*101},t,true);
        c.fillStyle=paper?'#405846':'#c2ccc1';c.fillText(['Fern','Woodland shrub','River reeds'][i],x,underY+27);
      });
    }
    function tick(now) {
      raf=0;
      if(!playing||document.hidden)return;
      if(last!==null)time+=(now-last)/1000;
      last=now;paint();raf=requestAnimationFrame(tick);
    }
    function toggle() {
      playing=!playing;last=null;
      if(raf)cancelAnimationFrame(raf);
      raf=playing?requestAnimationFrame(tick):0;synchronize();paint();
    }
    controls.era.addEventListener('change',e=>{era=e.target.value;update();});
    controls.day.addEventListener('click',()=>{paper=true;update();});
    controls.night.addEventListener('click',()=>{paper=false;update();});
    controls.mountains.addEventListener('click',()=>{view='mountains';update();});
    controls.vegetation.addEventListener('click',()=>{view='vegetation';update();});
    controls.scene.addEventListener('click',()=>{view='scene';update();});
    controls.motion.addEventListener('click',toggle);
    document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','SELECT','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
    window.addEventListener('resize',paint);
    source.addEventListener('worldbackdropready',paint);
    document.addEventListener('visibilitychange',()=>{last=null;if(raf)cancelAnimationFrame(raf);raf=0;if(!document.hidden&&playing)raf=requestAnimationFrame(tick);});
    reduced.addEventListener('change',()=>{if(reduced.matches&&playing)toggle();else paint();});
    window.addEventListener('pagehide',event=>{if(raf)cancelAnimationFrame(raf);raf=0;if(!event.persisted)renderer.destroy();});
    window.addEventListener('pageshow',event=>{if(event.persisted){last=null;paint();if(playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick);}});
    update();
  </script>
</body>
</html>
